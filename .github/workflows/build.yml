name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ältere, überholte Läufe desselben Branches abbrechen (spart CI-Minuten).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  build-and-unit:
    name: Build APK + Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # whisper.cpp @ v1.9.3

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle-Distribution + Dependency-Cache (auch Robolectrics android-all-Jar, ~100 MB)
      # Bewusst v5 (Node 24, MIT), nicht v6: ab v6 steckt das Caching in der proprietaeren
      # Komponente gradle-actions-caching; das Upgrade akzeptiert die Gradle Terms of Use
      # (https://blog.gradle.org/github-actions-for-gradle-v6). Wechsel nur nach Entscheidung.
      - uses: gradle/actions/setup-gradle@v5

      # packages explizit setzen: der Action-Default "tools platform-tools" bricht seit
      # Mitte September 2026, weil Google das laengst veraltete SDK-Paket "tools" nicht
      # mehr ausliefert — sdkmanager endet dann mit "Failed to find package 'tools'"
      # und Exit-Code 1 (android-actions/setup-android#537). Ab v4.0.2 ist der Default
      # repariert; explizit bleibt es trotzdem. NDK, CMake, Build-Tools und Platform
      # installiert der naechste Schritt ohnehin selbst.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: NDK, CMake, Build-Tools, Platform installieren
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;android-37.0"

      - name: Submodul-Commit ermitteln (Cache-Key)
        id: sub
        run: echo "whisper=$(git -C whisper.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Native-Zwischenstand (whisper/ggml-Objekte) — Key an Submodul-Commit, CMake-Dateien und Gradle-Config gebunden
      - name: CMake-Build cachen
        uses: actions/cache@v6
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ steps.sub.outputs.whisper }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}

      - name: JNI-Symbole abgleichen (Kotlin <-> C++)
        run: python3 tools/check_jni_symbols.py

      - name: Unit-Tests + Lint
        run: ./gradlew --no-daemon testVollDebugUnitTest testSimpleDebugUnitTest lintVollDebug lintSimpleDebug

      # Beide Editionen (Konzept WhisperLoom Simple §11.1): voll = die bisherige App, simple = Ein-Knopf-Tastatur.
      - name: Debug-APKs bauen (voll + simple)
        run: ./gradlew --no-daemon assembleVollDebug assembleSimpleDebug

      - name: Debug-APK (voll) als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: whisperloom-debug-apk
          path: app/build/outputs/apk/voll/debug/app-voll-debug.apk
          if-no-files-found: error

      # Simple-APK: feste Paket-ID (unabhaengig von whisperloom.applicationId), nur RECORD_AUDIO + INTERNET,
      # keine Overlay-/Bedienungshilfe-/Widget-Komponenten, keine Native-Bibliotheken.
      - name: Simple-Debug-APK pruefen (Paket-ID, Rechte, Komponenten, keine .so)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/simple/debug/app-simple-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          AAPT2="$AAPT2" tools/check_package_id.sh "$APK" com.chris.whisperloom.simple
          tools/check_simple_apk.sh "$APK" "$AAPT2"

      - name: Simple-Debug-APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: whisperloom-simple-debug-apk
          path: app/build/outputs/apk/simple/debug/app-simple-debug.apk
          if-no-files-found: error

      - name: Release-Keystore aus Secret schreiben
        env:
          KS_B64: ${{ secrets.WHISPERLOOM_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/whisperloom-release.p12"

      # Nur voll: der Haupt-App-Schluessel signiert nie die Simple-APK (Konzept E4). Das Simple-Release baut unten
      # unsigniert, bis SIMPLE_KEYSTORE als Secret vorliegt (Keystore legt Christof an).
      - name: Signiertes Release-APK (voll) bauen
        env:
          WHISPERLOOM_KEYSTORE: ${{ runner.temp }}/whisperloom-release.p12
          WHISPERLOOM_KEYSTORE_PASSWORD: ${{ secrets.WHISPERLOOM_KEYSTORE_PASSWORD }}
          WHISPERLOOM_KEY_ALIAS: whisperloom
        run: ./gradlew --no-daemon assembleVollRelease

      - name: Release-APK pruefen (Native-Lib da, kein Modell im APK, 16-KB-Alignment)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/voll/release/app-voll-release.apk
          unzip -l "$APK" | tee /tmp/apk-list.txt | grep -E ' (lib|assets)/' || true
          grep -qE ' lib/arm64-v8a/libwhisperloom\.so$' /tmp/apk-list.txt \
            || { echo "::error::lib/arm64-v8a/libwhisperloom.so fehlt im Release-APK"; exit 1; }
          if grep -qE ' assets/.*\.bin$' /tmp/apk-list.txt; then
            echo "::error::Modell-Datei (assets/*.bin) im APK — Modelle kommen nur per Download"; exit 1
          fi
          if grep -qE ' lib/(armeabi-v7a|x86|x86_64)/' /tmp/apk-list.txt; then
            echo "::error::unerwartete ABI im APK (nur arm64-v8a vorgesehen)"; exit 1
          fi
          ZA="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/zipalign"
          "$ZA" -c -P 16 -v 4 "$APK" | tail -n 3
          READELF="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          rm -rf /tmp/apk && unzip -o -q "$APK" 'lib/arm64-v8a/*.so' -d /tmp/apk
          for so in /tmp/apk/lib/arm64-v8a/*.so; do
            echo "== $so ($(stat -c %s "$so") Bytes)"
            "$READELF" -lW "$so" | awk '$1=="LOAD"{print "  LOAD align", $NF}'
            "$READELF" -lW "$so" | awk '$1=="LOAD" && $NF!="0x4000"{bad=1} END{exit bad}' \
              || { echo "::error::$so ist nicht 16-KB-aligned"; exit 1; }
          done
          # GitHub/F-Droid behalten ihre Paket-ID, sonst gehen Updates nicht ueber die installierte App
          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2" \
            tools/check_package_id.sh "$APK" com.chris.whisperloom

      - name: Release-APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: whisperloom-release-apk
          path: app/build/outputs/apk/voll/release/app-voll-release.apk
          if-no-files-found: error

      # R8-Mapping zum Entschluesseln von Stacktraces des signierten Builds
      - name: R8-Mapping als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: whisperloom-release-mapping
          path: app/build/outputs/mapping/vollRelease/mapping.txt
          if-no-files-found: error

      # ---- Play Store: signiertes Android App Bundle (.aab) ----
      # Play verlangt fuer neue Apps ein AAB (kein APK). Signiert mit demselben Key wie das APK
      # (dient als Play-Upload-Key). Der finale, an Nutzer ausgelieferte Build wird von Play App
      # Signing separat signiert (Google-verwalteter App-Signing-Key).
      # Paket-ID nur hier com.whisperloom (Play); APKs fuer GitHub/F-Droid bleiben com.chris.whisperloom.
      - name: Signiertes Release-AAB (Play Store) bauen
        env:
          WHISPERLOOM_KEYSTORE: ${{ runner.temp }}/whisperloom-release.p12
          WHISPERLOOM_KEYSTORE_PASSWORD: ${{ secrets.WHISPERLOOM_KEYSTORE_PASSWORD }}
          WHISPERLOOM_KEY_ALIAS: whisperloom
        run: ./gradlew --no-daemon bundleVollRelease -Pwhisperloom.applicationId=com.whisperloom

      - name: Release-AAB pruefen (Paket-ID, Native-Lib, kein Modell, nur arm64, Mapping + Symbole)
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          AAB=app/build/outputs/bundle/vollRelease/app-voll-release.aab
          # Die erste hochgeladene Paket-ID gehoert der Play-App fuer immer — vor dem Artefakt pruefen.
          export BUNDLETOOL="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl -fsSL -o "$BUNDLETOOL" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $BUNDLETOOL" | sha256sum -c -
          tools/check_package_id.sh "$AAB" com.whisperloom
          unzip -l "$AAB" | tee /tmp/aab-list.txt | grep -E ' base/(lib|assets)/' || true
          grep -qE ' base/lib/arm64-v8a/libwhisperloom\.so$' /tmp/aab-list.txt \
            || { echo "::error::base/lib/arm64-v8a/libwhisperloom.so fehlt im AAB"; exit 1; }
          if grep -qE ' base/assets/.*\.bin$' /tmp/aab-list.txt; then
            echo "::error::Modell-Datei (assets/*.bin) im AAB — Modelle kommen nur per Download"; exit 1
          fi
          if grep -qE ' base/lib/(armeabi-v7a|x86|x86_64)/' /tmp/aab-list.txt; then
            echo "::error::unerwartete ABI im AAB (nur arm64-v8a vorgesehen)"; exit 1
          fi
          # Play liest R8-Mapping und Native-Symbole aus dem Bundle — keine Warnung "Deobfuscation file"/"Debug symbols"
          grep -qE ' BUNDLE-METADATA/com\.android\.tools\.build\.obfuscation/proguard\.map$' /tmp/aab-list.txt \
            || { echo "::error::R8-Mapping fehlt im AAB"; exit 1; }
          grep -qE ' BUNDLE-METADATA/com\.android\.tools\.build\.debugsymbols/arm64-v8a/libwhisperloom\.so\.(sym|dbg)$' /tmp/aab-list.txt \
            || { echo "::error::Native-Debug-Symbole fuer libwhisperloom.so fehlen im AAB"; exit 1; }

      - name: Release-AAB als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: whisperloom-play-aab
          path: app/build/outputs/bundle/vollRelease/app-voll-release.aab
          if-no-files-found: error

      # ---- WhisperLoom Simple: Release-APK (R8), ohne Haupt-App-Schluessel ----
      # Mit der Play-Property gebaut, um zu beweisen, dass die feste Simple-ID nicht an ihr haengt.
      - name: Release-APK (simple) bauen
        env:
          WHISPERLOOM_KEYSTORE: ${{ runner.temp }}/whisperloom-release.p12
          WHISPERLOOM_KEYSTORE_PASSWORD: ${{ secrets.WHISPERLOOM_KEYSTORE_PASSWORD }}
          WHISPERLOOM_KEY_ALIAS: whisperloom
        run: ./gradlew --no-daemon assembleSimpleRelease -Pwhisperloom.applicationId=com.whisperloom

      - name: Simple-Release-APK pruefen (Paket-ID, Rechte, keine .so, nicht mit dem Haupt-App-Schluessel signiert)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/simple/release/app-simple-release*.apk | head -n 1)
          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          AAPT2="$AAPT2" tools/check_package_id.sh "$APK" com.chris.whisperloom.simple
          tools/check_simple_apk.sh "$APK" "$AAPT2"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          MAIN_CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/voll/release/app-voll-release.apk | grep -m1 'SHA-256' || true)
          SIMPLE_CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -m1 'SHA-256' || echo "unsigniert")
          echo "voll:   $MAIN_CERT"
          echo "simple: $SIMPLE_CERT"
          if [ -n "$MAIN_CERT" ] && [ "$MAIN_CERT" = "$SIMPLE_CERT" ]; then
            echo "::error::Simple-APK ist mit dem Schluessel der Haupt-App signiert (E4 verletzt)"; exit 1
          fi

      - name: Simple-Release-APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: whisperloom-simple-release-apk
          path: app/build/outputs/apk/simple/release/app-simple-release*.apk
          if-no-files-found: error

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-and-lint-reports
          path: app/build/reports/
